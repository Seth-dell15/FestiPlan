name: CI

on:
  push:
  pull_request:

jobs:
  qualite-et-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Qualité du code (ruff)
        run: ruff check app tests

      - name: Tests (pytest)
        run: python -m pytest
